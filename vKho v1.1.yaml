openapi: 3.0.0
info:
  title: vKho
  description: The vKho API description
  version: '1.0'
  contact: {}
tags: []
servers:
  - url: https://api.vkho.net
    variables: {}
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    CreateProductOrderDto:
      type: object
      properties:
        total:
          type: number
        boothCode:
          type: string
        sku:
          type: string
      required:
        - total
        - boothCode
        - sku
    CreateOrder:
      type: object
      properties:
        nameCustomer:
          type: string
        code:
          type: string
        boothCode:
          type: string
        deliveryAdress:
          type: string
        deliveryTime:
          format: date-time
          type: string
        driverName:
          type: string
        warehouseId:
          type: number
        productOrders:
          type: array
          items:
            $ref: '#/components/schemas/CreateProductOrderDto'
      required:
        - nameCustomer
        - code
        - boothCode
        - deliveryAdress
        - deliveryTime
        - driverName
        - warehouseId
        - productOrders
    UpdateProductOrder:
      type: object
      properties:
        id:
          type: number
        pickingQuantity:
          type: number
      required:
        - id
        - pickingQuantity
    UpdateOrder:
      type: object
      properties:
        id:
          type: number
        boothCode:
          type: string
        deliveryAdress:
          type: string
        deliveryTime:
          format: date-time
          type: string
        driverName:
          type: string
        status:
          type: string
          enum:
            - ENABLE
            - PICKING
            - PACKAGED
            - READY
            - DISABLE
            - MOVING
            - SUCCESS
            - WAITING
            - NEW
            - INITIAL
            - WAIT_PAYMENT
            - SUBMITTED
            - AWAITING_PICKUP
            - DELIVERING
            - DELIVERED
            - CANCELLED
            - PAYMENT_FAILED
            - RETURN
        updateProductOrder:
          type: array
          items:
            $ref: '#/components/schemas/UpdateProductOrder'
      required:
        - id
        - boothCode
        - deliveryAdress
        - deliveryTime
        - driverName
        - status
        - updateProductOrder
    UpdateOrders:
      type: object
      properties:
        ids:
          type: array
          items:
            type: number
        status:
          type: string
          enum:
            - ENABLE
            - PICKING
            - PACKAGED
            - READY
            - DISABLE
            - MOVING
            - SUCCESS
            - WAITING
            - NEW
            - INITIAL
            - WAIT_PAYMENT
            - SUBMITTED
            - AWAITING_PICKUP
            - DELIVERING
            - DELIVERED
            - CANCELLED
            - PAYMENT_FAILED
            - RETURN
      required:
        - ids
        - status
    CheckPickingOrder:
      type: object
      properties:
        ids:
          type: array
          items:
            type: number
        userId:
          type: string
      required:
        - ids
        - userId
    ConfirmOrder:
      type: object
      properties:
        id:
          type: number
      required:
